<div class="relative w-32">
  <div class="flex items-stretch rounded-lg bg-neutral-800 ring-1 ring-white/10 focus-within:ring-2 focus-within:ring-green-500">
    <input #field [id]="inputId()" type="text" inputmode="numeric" autocomplete="off"
      aria-haspopup="listbox" [attr.aria-expanded]="open()"
      [value]="value()"
      (input)="onType(field)"
      (blur)="restore(field)"
      (keydown.arrowDown)="open.set(true)"
      class="min-w-0 flex-1 bg-transparent px-3 py-2 text-sm text-white focus:outline-none" />
    <button type="button" (click)="toggle()" aria-label="Show page size options"
      [attr.aria-expanded]="open()"
      class="rounded-r-lg px-2 text-neutral-400 hover:text-white focus:outline-none focus-visible:text-white">
      <svg viewBox="0 0 20 20" class="h-4 w-4 transition-transform" [class.rotate-180]="open()"
        fill="currentColor" aria-hidden="true">
        <path d="M5.3 7.3a1 1 0 0 1 1.4 0L10 10.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 0 1 0-1.4Z" />
      </svg>
    </button>
  </div>

  @if (open()) {
    <ul role="listbox" aria-label="Songs per page"
      class="absolute left-0 z-20 mt-1 w-full overflow-hidden rounded-lg bg-neutral-800 py-1 shadow-xl ring-1 ring-white/10">
      @for (option of options(); track option) {
        <li role="option" [attr.aria-selected]="option === value()">
          <!-- mousedown keeps the field from blurring (and resetting) before the click lands -->
          <button type="button" (mousedown)="$event.preventDefault()" (click)="choose(field, option)"
            class="block w-full px-3 py-1.5 text-left text-sm hover:bg-white/10 focus:outline-none focus-visible:bg-white/10"
            [class]="option === value() ? 'font-semibold text-green-400' : 'text-neutral-200'">
            {{ option }}
          </button>
        </li>
      }
    </ul>
  }
</div>
